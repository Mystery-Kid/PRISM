<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PRISM Audio and Effect Preset Test</title>
  </head>
  <body>
    <pre id="result">RUNNING</pre>
    <script type="module">
      import { renderSessionWav } from "./render.ts";
      import { AudioEngine } from "./AudioEngine.ts";
      import { encodeAudioBufferWav } from "./wav.ts";
      import { createElement, useState } from "react";
      import { createRoot } from "react-dom/client";
      import { EffectsPanel } from "../components/EffectsPanel.tsx";
      import { RoutingPanel } from "../components/RoutingPanel.tsx";
      import { SamplerPanel } from "../components/SamplerPanel.tsx";
      import { DrumPanel } from "../components/DrumPanel.tsx";
      import { getAllowedBusTargets } from "../../shared/audio-routing.ts";

      const result = document.getElementById("result");
      const report = (message) => fetch("/__prism_audio_test_result", {
        method: "POST",
        body: JSON.stringify(message),
      });
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      assert.equal = (actual, expected, message = "") =>
        assert(Object.is(actual, expected), message || `Expected ${String(actual)} to equal ${String(expected)}.`);
      assert.deepEqual = (actual, expected, message = "") =>
        assert(JSON.stringify(actual) === JSON.stringify(expected),
          message || `Expected ${JSON.stringify(actual)} to equal ${JSON.stringify(expected)}.`);
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const pcmRms = (bytes, fromSeconds = 0.1, toSeconds = 0.3) => {
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        let sum = 0, count = 0;
        for (let frame = Math.floor(fromSeconds * 48000); frame < Math.floor(toSeconds * 48000); frame++) {
          const offset = 44 + frame * 4;
          if (offset + 1 >= bytes.byteLength) break;
          const sample = view.getInt16(offset, true) / 32768;
          sum += sample * sample;
          count++;
        }
        return Math.sqrt(sum / Math.max(1, count));
      };
      const render = (session) => renderSessionWav(session, async () => {
        throw new Error("The MIDI-only render must not request audio assets.");
      });
      const testEffectsWorkspace = async (session) => {
        const stored = [];
        const notices = [];
        let exportedFile = null;
        window.confirm = () => true;
        window.prism = {
          listEffectPresets: async (projectId) => stored.filter((preset) =>
            preset.scope === "global" || preset.projectId === projectId),
          saveEffectPreset: async (input) => {
            const saved = {
              ...structuredClone(input),
              createdAt: input.createdAt ?? new Date(0).toISOString(),
              updatedAt: new Date(0).toISOString(),
            };
            const index = stored.findIndex((preset) => preset.id === saved.id);
            if (index < 0) stored.push(saved);
            else stored[index] = saved;
            return saved;
          },
          deleteEffectPreset: async (id) => {
            const index = stored.findIndex((preset) => preset.id === id);
            if (index >= 0) stored.splice(index, 1);
          },
          importEffectPreset: async () => ({
            format: "prism-effect-chain",
            version: 1,
            name: "Imported Chain",
            effects: [
              { id: "imported-eq", type: "equalizer", enabled: true, parameters: { frequency: 800, gain: 2, q: 1 } },
              { id: "future-vst", type: "future-vst", enabled: true, parameters: { amount: 0.6 }, raw: {
                id: "future-vst", type: "future-vst", enabled: true, parameters: { amount: 0.6 },
                vendorState: { preset: "future room" }, note: "never execute this string",
              } },
            ],
          }),
          exportEffectPreset: async (file) => { exportedFile = structuredClone(file); return true; },
        };
        const container = document.createElement("div");
        container.style.cssText = "position:fixed;left:-1500px;top:0;width:1100px;height:360px";
        document.body.append(container);
        function Harness() {
          const [working, setWorking] = useState(() => ({
            ...session,
            buses: [...session.buses, {
              id: "effects-bus",
              name: "Effects Bus",
              level: 1,
              muted: false,
              solo: false,
              outputBusId: null,
              sends: [],
              effects: [],
            }],
          }));
          const [selectedBusId, setSelectedBusId] = useState("");
          window.__effectsHarnessSession = working;
          return createElement(EffectsPanel, {
            session: working,
            selectedTrackId: working.tracks[0].id,
            selectedBusId,
            onSelectTrack: () => {},
            onSelectBus: setSelectedBusId,
            onUpdateTrackEffects: (id, effects) => setWorking((current) => ({
              ...current,
              tracks: current.tracks.map((track) => track.id === id ? { ...track, effects } : track),
            })),
            onUpdateBusEffects: (id, effects) => setWorking((current) => ({
              ...current,
              buses: current.buses.map((bus) => bus.id === id ? { ...bus, effects } : bus),
            })),
            onUpdateMasterEffects: (masterEffects) => setWorking((current) => ({ ...current, masterEffects })),
            onNotice: (message) => notices.push(message),
          });
        }
        const root = createRoot(container);
        const lookup = (selector) => {
          const element = container.querySelector(selector);
          assert(element, `Missing effect-workspace control: ${selector}`);
          return element;
        };
        const click = async (selector) => { lookup(selector).click(); await wait(25); };
        const setValue = async (selector, value, tag = "input") => {
          const element = lookup(selector);
          const prototype = tag === "select" ? HTMLSelectElement.prototype : HTMLInputElement.prototype;
          Object.getOwnPropertyDescriptor(prototype, "value").set.call(element, value);
          element.dispatchEvent(new Event(tag === "select" ? "change" : "input", { bubbles: true }));
          await wait(25);
        };
        try {
          root.render(createElement(Harness));
          await wait(60);
          assert(lookup('[data-testid="button-browse-add-equalizer"]'), "Native equalizer browser entry is missing.");
          await setValue('[data-testid="input-effects-search"]', "vst");
          assert(container.querySelector(".effect-browser-card.unavailable"), "Unavailable plug-in formats are not identified.");
          assert(!container.querySelector('[data-testid="button-browse-add-equalizer"]'), "Search did not filter native effects.");
          await setValue('[data-testid="input-effects-search"]', "");

          await click('[data-testid="button-browse-add-equalizer"]');
          await click('[data-testid="button-browse-add-delay"]');
          let chain = window.__effectsHarnessSession.tracks[0].effects;
          assert.equal(chain.length, 2);
          await click('button[aria-label="Move Delay up"]');
          chain = window.__effectsHarnessSession.tracks[0].effects;
          assert.equal(chain[0].type, "delay", "Move controls did not change processing order.");
          const equalizerIndex = chain.findIndex((effect) => effect.type === "equalizer");
          const equalizerId = chain[equalizerIndex].id;
          await setValue(`[data-testid="track-effect-${equalizerId}-gain"]`, "12");
          assert.equal(window.__effectsHarnessSession.tracks[0].effects[equalizerIndex].parameters.gain, 12);
          await click(`button[aria-label="Reset Equalizer"]`);
          chain = window.__effectsHarnessSession.tracks[0].effects;
          assert.equal(chain.find((effect) => effect.id === equalizerId).parameters.gain, 0, "Reset did not restore the shared default.");
          await click(`[data-testid="track-effect-toggle-${equalizerId}"]`);
          chain = window.__effectsHarnessSession.tracks[0].effects;
          assert.equal(chain.find((effect) => effect.id === equalizerId).enabled, false, "Bypass did not update session state.");
          await click(`button[aria-label="Duplicate Delay"]`);
          chain = window.__effectsHarnessSession.tracks[0].effects;
          assert.equal(chain.length, 3, "Duplicate did not create a chain entry.");
          const duplicatedId = chain.find((effect) => effect.type === "delay" && effect.id !== chain[0].id).id;
          await click(`[data-testid="effect-unit-${duplicatedId}"] button[title="Remove effect"]`);
          assert.equal(window.__effectsHarnessSession.tracks[0].effects.length, 2, "Remove did not update the chain.");

          await setValue('[data-testid="input-effect-preset-name"]', "Reusable Chain");
          await click('[data-testid="button-save-effect-preset"]');
          assert.equal(stored.length, 1, "Saving a chain did not persist the preset.");
          const savedPreset = stored[0];
          await click(`.effect-preset-card button[title="Rename preset"]`);
          await setValue('input[aria-label="Rename Reusable Chain"]', "Renamed Chain");
          await click('.effect-preset-card button[title="Save name"]');
          assert.equal(stored[0].name, "Renamed Chain", "Rename did not update the preset.");
          await click('.effect-preset-card button[title="Duplicate preset"]');
          assert.equal(stored.length, 2, "Duplicate preset did not persist a copy.");

          await click('[data-testid="button-import-effect-preset"]');
          assert.equal(stored.length, 3, "Import did not save the validated preset.");
          const imported = stored.find((preset) => preset.name === "Imported Chain");
          assert.equal(imported.effects.find((effect) => effect.type === "future-vst").raw.vendorState.preset, "future room");
          const importedCard = container.querySelector(`[data-testid="effect-preset-${imported.id}"]`);
          assert(importedCard?.textContent.includes("unavailable"), "Unavailable effect was not identified in the preset list.");
          importedCard.querySelector(`[data-testid="button-effect-preset-load-${imported.id}"]`).click();
          await wait(25);
          chain = window.__effectsHarnessSession.tracks[0].effects;
          assert.equal(chain.length, 1, "Load did not apply available effects only.");
          assert.equal(chain[0].type, "equalizer");
          assert.equal(imported.effects.some((effect) => effect.type === "future-vst"), true,
            "Loading dropped unavailable data from the stored preset.");
          importedCard.querySelector(`[data-testid="button-effect-preset-append-${imported.id}"]`).click();
          await wait(25);
          assert.equal(window.__effectsHarnessSession.tracks[0].effects.length, 2, "Append did not preserve the active chain.");
          importedCard.querySelector('button[title="Export preset JSON"]').click();
          await wait(25);
          assert.equal(exportedFile.effects.find((effect) => effect.type === "future-vst").raw.vendorState.preset, "future room",
            "Export dropped unavailable effect data.");

          await setValue('[data-testid="select-effect-preset-scope"]', "global", "select");
          await setValue('[data-testid="input-effect-preset-name"]', "Global Chain");
          await click('[data-testid="button-save-effect-preset"]');
          assert.equal(stored.find((preset) => preset.name === "Global Chain").projectId, null,
            "Global preset was incorrectly tied to one release.");
          const globalCard = [...container.querySelectorAll(".effect-preset-card")]
            .find((card) => card.textContent.includes("Global Chain"));
          globalCard.querySelector('button[title="Delete preset"]').click();
          await wait(25);
          assert.equal(stored.some((preset) => preset.name === "Global Chain"), false,
            "Delete did not remove the selected reusable preset.");
          assert(notices.length > 0, "Preset operations did not report their results.");
        await setValue('[data-testid="select-effect-chain-target"]', "bus", "select");
        await wait(35);
        await click('[data-testid="button-browse-add-delay"]');
        assert.equal(window.__effectsHarnessSession.buses[0].effects.length, 1,
          "The effect editor did not save the chain to the selected bus.");
        } finally {
          root.unmount();
          container.remove();
        }
      };
      const testRoutingWorkspace = async (initialSession) => {
        const originalConfirm = window.confirm;
        const originalPrompt = window.prompt;
        let editedBusId = null;
        const notices = [];
        window.confirm = () => true;
        window.prompt = () => "Drum Bus Renamed";
        const container = document.createElement("div");
        container.style.cssText = "position:fixed;left:-1500px;top:0;width:1100px;height:420px";
        document.body.append(container);
        function Harness() {
          const [working, setWorking] = useState(initialSession);
          window.__routingHarnessSession = working;
          return createElement(RoutingPanel, {
            session: working,
            selectedTrackId: working.tracks[0]?.id ?? "",
            meters: {},
            allowedBusTargets: (sourceId) => getAllowedBusTargets(working.tracks, working.buses, sourceId),
            onChange: setWorking,
            onSelectTrack: () => {},
            onEditBusEffects: (busId) => { editedBusId = busId; },
            onNotice: (message) => notices.push(message),
          });
        }
        const root = createRoot(container);
        const lookup = (selector) => {
          const element = container.querySelector(selector);
          assert(element, `Missing routing control: ${selector}`);
          return element;
        };
        const click = async (selector) => { lookup(selector).click(); await wait(30); };
        const setValue = async (selector, value, tag = "input") => {
          const element = lookup(selector);
          const prototype = tag === "select" ? HTMLSelectElement.prototype : HTMLInputElement.prototype;
          Object.getOwnPropertyDescriptor(prototype, "value").set.call(element, value);
          element.dispatchEvent(new Event(tag === "select" ? "change" : "input", { bubbles: true }));
          await wait(30);
        };
        try {
          root.render(createElement(Harness));
          await wait(60);
          await click(".rp-add-bus");
          await setValue("#rp-new-bus-name", "Drum Bus");
          await click(".rp-create-confirm");
          let state = window.__routingHarnessSession;
          assert.equal(state.buses.length, 1, "The routing panel did not create a bus.");
          const drumBusId = state.buses[0].id;
          await click('[aria-label="Rename Drum Bus"]');
          assert.equal(window.__routingHarnessSession.buses[0].name, "Drum Bus Renamed",
            "The routing panel did not rename the bus.");

          await setValue('[aria-label="Test Synth output destination"]', drumBusId, "select");
          await click(".rp-track-list .rp-text-button");
          state = window.__routingHarnessSession;
          assert.equal(state.tracks[0].outputBusId, drumBusId, "The track output selector did not route to the bus.");
          assert.equal(state.tracks[0].sends.length, 1, "The routing panel did not add a track send.");
          await click('input[value="pre"]');
          assert.equal(window.__routingHarnessSession.tracks[0].sends[0].placement, "pre",
            "The send did not switch to pre-fader.");
          await setValue('[aria-label="Drum Bus Renamed level"]', "0.65");
          assert.equal(window.__routingHarnessSession.buses[0].level, 0.65,
            "The bus fader did not update its saved level.");
          await click('[aria-label="Edit effects for Drum Bus Renamed"]');
          assert.equal(editedBusId, drumBusId, "The bus effects control did not select the bus.");

          await click(".rp-add-bus");
          await setValue("#rp-new-bus-name", "Aux");
          await click(".rp-create-confirm");
          state = window.__routingHarnessSession;
          const auxBusId = state.buses.find((bus) => bus.name === "Aux").id;
          await setValue('[aria-label="Aux output destination"]', drumBusId, "select");
          const drumOutputOptions = [...lookup('[aria-label="Drum Bus Renamed output destination"]').options];
          assert(!drumOutputOptions.some((option) => option.value === auxBusId),
            "The UI offered an output that would create a routing cycle.");
          await click('[aria-label="Delete Drum Bus Renamed"]');
          state = window.__routingHarnessSession;
          assert.equal(state.buses.some((bus) => bus.id === drumBusId), false, "Deleting the bus did not remove it.");
          assert.equal(state.tracks[0].outputBusId, null, "Deleting a bus did not return its track output to Master.");
          assert.equal(state.tracks[0].sends.length, 0, "Deleting a bus left a dangling send.");
          assert.equal(state.buses[0].outputBusId, null, "Deleting a bus left a dangling bus output.");
          assert(notices.length > 0, "Bus operations did not report their result.");
        } finally {
          root.unmount();
          container.remove();
          window.confirm = originalConfirm;
          window.prompt = originalPrompt;
        }
      };
      const testInstrumentPanels = async () => {
        const assets = [
          { id: "sample-ui", fileName: "sample.wav", mimeType: "audio/wav" },
          { id: "sample-ui-2", fileName: "snare.wav", mimeType: "audio/wav" },
        ];
        const container = document.createElement("div");
        container.style.cssText = "position:fixed;left:-1500px;top:0;width:1200px;height:420px";
        document.body.append(container);
        let activeRoot = null;
        try {
          let sampler = { sampleAssetId: null, rootNote: 60, gain: 1 };
          const samplerActions = { import: 0, preview: 0, add: 0, pattern: 0 };
          const samplerRoot = createRoot(container);
          activeRoot = samplerRoot;
          const renderSampler = () => samplerRoot.render(createElement(SamplerPanel, {
            sampler, assets, assetsLoading: false, missingSampleIds: [], recoveryMessage: "",
            onChange: (next) => { sampler = next; renderSampler(); },
            onImportSample: () => samplerActions.import++,
            onPreview: () => samplerActions.preview++,
            onAddNote: () => samplerActions.add++,
            onOpenPattern: () => samplerActions.pattern++,
          }));
          const setValue = async (selector, value, tag = "input") => {
            const field = container.querySelector(selector);
            assert(field, `Missing instrument-panel control: ${selector}`);
            const setter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(field), "value")?.set;
            if (setter) setter.call(field, String(value));
            else field.value = String(value);
            field.dispatchEvent(new Event(tag === "select" ? "change" : "input", { bubbles: true }));
            await wait(25);
          };
          const click = async (selector) => {
            const button = container.querySelector(selector);
            assert(button, `Missing instrument-panel action: ${selector}`);
            button.click();
            await wait(25);
          };
          renderSampler();
          await wait(30);
          await setValue('[data-testid="select-sampler-sample"]', "sample-ui", "select");
          await setValue('[data-testid="input-sampler-root-note"]', 64);
          await setValue('[data-testid="input-sampler-gain"]', 0.75);
          assert.equal(sampler.sampleAssetId, "sample-ui", "Sampler sample selection did not update the assignment.");
          assert.equal(sampler.rootNote, 64, "Sampler root note did not update.");
          assert.equal(sampler.gain, 0.75, "Sampler gain did not update.");
          await click('[data-testid="button-sampler-import"]');
          await click('[data-testid="button-sampler-preview"]');
          await click('[data-testid="button-sampler-add-note"]');
          await click('[data-testid="button-sampler-open-pattern"]');
          assert.deepEqual(samplerActions, { import: 1, preview: 1, add: 1, pattern: 1 });
          samplerRoot.unmount();
          activeRoot = null;

          let drumKit = { pads: [
            { id: "kick-ui", name: "Kick", note: 36, sampleAssetId: "sample-ui", gain: 1 },
            { id: "snare-ui", name: "Snare", note: 38, sampleAssetId: "sample-ui-2", gain: 1 },
          ] };
          let drumNotes = [];
          let hits = 0;
          let previews = 0;
          const drumRoot = createRoot(container);
          activeRoot = drumRoot;
          const renderDrums = () => drumRoot.render(createElement(DrumPanel, {
            drumKit, notes: drumNotes, assets, assetsLoading: false, missingSampleIds: [], recoveryMessage: "",
            tempo: 120, timeSignature: "4/4",
            onChange: (next) => { drumKit = next; renderDrums(); },
            onNotesChange: (next) => { drumNotes = next; renderDrums(); },
            onImportSample: () => {},
            onPreviewPad: () => previews++,
            onAddHit: () => hits++,
            onOpenPattern: () => {},
          }));
          renderDrums();
          await wait(30);
          await setValue('[data-testid="input-drum-pad-note-kick-ui"]', 38);
          assert.equal(drumKit.pads[0].note, 36, "Duplicate pad MIDI notes were accepted.");
          assert(container.querySelector('[data-testid="status-drum-duplicate-note"]'), "Duplicate MIDI assignment was not reported.");
          await click('[data-testid="button-drum-add-pad"]');
          assert.equal(drumKit.pads.length, 3, "Adding a drum pad did not update the kit.");
          assert.equal(new Set(drumKit.pads.map((pad) => pad.note)).size, 3, "New drum pad reused an existing MIDI note.");
          await click('[data-testid="button-drum-step-kick-ui-1"]');
          assert.equal(drumNotes.length, 1, "Step toggles did not create MIDI notes.");
          assert.equal(drumNotes[0].startBeat, 0, "A first-bar step was not placed at the right musical time.");
          await click('[data-testid="button-drum-pattern-duplicate"]');
          assert.equal(drumNotes.length, 2, "Pattern duplication did not copy MIDI hits.");
          assert.equal(drumNotes[1].startBeat, 4, "Pattern duplication did not place the next bar.");
          assert.equal(drumKit.patternStartBeat, 4, "Pattern editor did not advance to the duplicated bar.");
          await click('[data-testid="button-drum-pattern-clear"]');
          assert.equal(drumNotes.length, 1, "Clearing the selected pattern removed notes from the original pattern.");
          await setValue('[data-testid="select-drum-pattern-length"]', 2, "select");
          assert.equal(drumKit.patternLengthBars, 2, "Pattern length did not update.");
          await setValue('[data-testid="input-drum-pattern-start-bar"]', 3);
          assert.equal(drumKit.patternStartBeat, 8, "Pattern placement did not map bar three to beat eight.");
          await click('[data-testid="button-drum-pad-preview-kick-ui"]');
          await click('[data-testid="button-drum-pad-add-hit-kick-ui"]');
          assert.equal(previews, 1);
          assert.equal(hits, 1);
        } finally {
          activeRoot?.unmount();
          container.remove();
        }
      };
      let engine;
      let sampleEngine;
      let missingEngine;
      try {
        await report({ progress: "rendering MIDI and checking the exported PCM samples" });
        const session = {
          id: "midi-render-test",
          releaseId: "release-test",
          title: "MIDI Render Test",
          tempo: 120,
          timeSignature: "4/4",
          loopRange: null,
          metronomeEnabled: false,
          masterVolume: 1,
          masterEffects: [],
          buses: [],
          updatedAt: new Date(0).toISOString(),
          tracks: [{
            id: "instrument-test",
            name: "Test Synth",
            type: "instrument",
            color: "#7c9ef2",
            volume: 0.8,
            pan: 0,
            muted: false,
            solo: false,
            recordArmed: false,
            clips: [],
            notes: [
              { id: "note-a", pitch: 60, startBeat: 0, durationBeats: 1, velocity: 48 },
              { id: "note-b", pitch: 69, startBeat: 1, durationBeats: 1, velocity: 116 },
            ],
            instrument: {
              waveform: "triangle",
              attack: 0.01,
              decay: 0.12,
              sustain: 0.62,
              release: 0.18,
            },
            effects: [],
            outputBusId: null,
            sends: [],
          }],
        };

        const wav = await render(session);
        const view = new DataView(wav.buffer, wav.byteOffset, wav.byteLength);
        if (
          view.getUint32(0, false) !== 0x52494646 ||
          view.getUint32(8, false) !== 0x57415645 ||
          view.getUint32(24, true) !== 48_000 ||
          view.getUint16(22, true) !== 2 ||
          view.getUint16(34, true) !== 16
        ) {
          throw new Error("The render did not produce a 48 kHz, 16-bit stereo WAV.");
        }

        let peak = 0;
        for (let offset = 44; offset + 1 < wav.byteLength; offset += 2) {
          peak = Math.max(peak, Math.abs(view.getInt16(offset, true)));
        }
        if (peak < 500) throw new Error(`The rendered MIDI output is silent (peak ${peak}).`);
        const track = {
          ...session.tracks[0],
          volume: 1,
          instrument: { ...session.tracks[0].instrument, waveform: "sine" },
          notes: [{ id: "held", pitch: 69, startBeat: 0, durationBeats: 2, velocity: 100 }],
        };
        const single = { ...session, tracks: [track] };
        const singleWav = await render(single);
        const fullLevel = pcmRms(singleWav);
        const singleView = new DataView(singleWav.buffer, singleWav.byteOffset, singleWav.byteLength);
        let crossings = 0;
        for (let frame = 4801; frame < 14400; frame++) {
          if (singleView.getInt16(44 + (frame - 1) * 4, true) <= 0 &&
              singleView.getInt16(44 + frame * 4, true) > 0) crossings++;
        }
        assert(Math.abs(crossings / 0.2 - 440) < 8, "The rendered note has the wrong pitch.");
        assert(pcmRms(singleWav, 0.98, 1) < fullLevel * 0.15, "The note did not release at its saved duration.");
        const delayed = await render({ ...single, tracks: [{
          ...track, notes: [{ ...track.notes[0], startBeat: 1 }],
        }] });
        assert(pcmRms(delayed, 0, 0.45) === 0 && pcmRms(delayed, 0.6, 0.8) > 0.03,
          "The saved MIDI onset timing was not respected.");
        const quarterMaster = pcmRms(await render({ ...single, masterVolume: 0.25 }));
        const quarterTrack = pcmRms(await render({ ...single, tracks: [{ ...track, volume: 0.25 }] }));
        const halfVelocity = pcmRms(await render({
          ...single, tracks: [{ ...track, notes: [{ ...track.notes[0], velocity: 50 }] }],
        }));
        assert(Math.abs(quarterMaster / fullLevel - 0.25) < 0.01, "The master level was not applied to WAV output.");
        assert(Math.abs(quarterTrack / fullLevel - 0.25) < 0.01, "The track level was not applied to WAV output.");
        assert(Math.abs(halfVelocity / fullLevel - 0.5) < 0.01, "Velocity did not scale the rendered performance.");
        const renderBus = {
          id: "render-submix",
          name: "Render Submix",
          level: 1,
          muted: false,
          solo: false,
          outputBusId: null,
          sends: [],
          effects: [],
        };
        const routed = {
          ...single,
          buses: [renderBus],
          tracks: [{ ...track, outputBusId: renderBus.id, sends: [] }],
        };
        const quarterBus = pcmRms(await render({
          ...routed,
          buses: [{ ...renderBus, level: 0.25 }],
        }));
        assert(Math.abs(quarterBus / fullLevel - 0.25) < 0.015,
          "The bus level did not affect the exported signal independently of its track.");
        const busEqualized = pcmRms(await render({
          ...routed,
          buses: [{
            ...renderBus,
            effects: [{ id: "bus-eq", type: "equalizer", enabled: true, parameters: { frequency: 440, gain: -18, q: 1 } }],
          }],
        }));
        assert(busEqualized < fullLevel * 0.3, "Bus effects did not process the routed WAV signal.");

        const auxiliary = { ...renderBus, id: "render-aux", name: "Render Aux" };
        const preFaderTrack = {
          ...track,
          volume: 0,
          outputBusId: auxiliary.id,
          sends: [{ id: "track-pre", busId: auxiliary.id, level: 1, placement: "pre" }],
        };
        const postFaderTrack = {
          ...preFaderTrack,
          sends: [{ id: "track-post", busId: auxiliary.id, level: 1, placement: "post" }],
        };
        const preFaderSend = pcmRms(await render({
          ...single,
          buses: [auxiliary],
          tracks: [preFaderTrack],
        }));
        const postFaderSend = pcmRms(await render({
          ...single,
          buses: [auxiliary],
          tracks: [postFaderTrack],
        }));
        assert(preFaderSend > fullLevel * 0.8, "The pre-fader track send followed the track fader.");
        assert(postFaderSend === 0, "The post-fader track send ignored a zero track fader.");

        const submix = {
          ...renderBus,
          id: "render-submix-zero",
          name: "Render Zero Submix",
          level: 0,
          sends: [{ id: "bus-pre", busId: auxiliary.id, level: 1, placement: "pre" }],
        };
        const busPreFaderSend = pcmRms(await render({
          ...single,
          buses: [submix, auxiliary],
          tracks: [{ ...track, outputBusId: submix.id, sends: [] }],
        }));
        const busPostFaderSend = pcmRms(await render({
          ...single,
          buses: [{
            ...submix,
            sends: [{ id: "bus-post", busId: auxiliary.id, level: 1, placement: "post" }],
          }, auxiliary],
          tracks: [{ ...track, outputBusId: submix.id, sends: [] }],
        }));
        assert(busPreFaderSend > fullLevel * 0.8, "The pre-fader bus send followed the bus fader.");
        assert(busPostFaderSend === 0, "The post-fader bus send ignored a zero bus fader.");

        const muted = await render({ ...single, tracks: [{ ...track, muted: true }] });
        assert(pcmRms(muted) === 0, "A muted instrument leaked into the export.");
        const zeroTrack = await render({ ...single, tracks: [{ ...track, volume: 0 }] });
        assert(pcmRms(zeroTrack, 0, 0.1) === 0, "A zero-level instrument leaked into the export.");

        const eq = await render({ ...single, tracks: [{
          ...track,
          effects: [{ id: "eq", type: "equalizer", enabled: true, parameters: { frequency: 440, gain: -18, q: 1 } }],
        }] });
        assert(pcmRms(eq) < fullLevel * 0.3, "Track processing did not affect the instrument export.");
        const bypassedEq = await render({ ...single, tracks: [{
          ...track,
          effects: [{ id: "eq-bypass", type: "equalizer", enabled: false, parameters: { frequency: 440, gain: -18, q: 1 } }],
        }] });
        assert(Math.abs(pcmRms(bypassedEq) / fullLevel - 1) < 0.03, "Bypassing an effect did not restore the dry signal.");
        const eqUnit = { id: "order-eq", type: "equalizer", enabled: true, parameters: { frequency: 440, gain: 18, q: 1 } };
        const compressorUnit = { id: "order-comp", type: "compressor", enabled: true, parameters: { threshold: -30, ratio: 20, attack: 0.001, release: 0.01, knee: 0 } };
        const eqThenCompressor = pcmRms(await render({ ...single, tracks: [{
          ...track, effects: [eqUnit, compressorUnit],
        }] }));
        const compressorThenEq = pcmRms(await render({ ...single, tracks: [{
          ...track, effects: [compressorUnit, eqUnit],
        }] }));
        assert(Math.abs(eqThenCompressor - compressorThenEq) > fullLevel * 0.08,
          `Reordering the chain did not change the processed signal (${eqThenCompressor.toFixed(3)} vs ${compressorThenEq.toFixed(3)}).`);
        const chord = await render({ ...single, tracks: [{
          ...track,
          notes: [60, 64, 69].map((pitch, index) => ({ ...track.notes[0], id: `chord-${index}`, pitch, velocity: 40 })),
        }] });
        const quietSingle = await render({ ...single, tracks: [{
          ...track, notes: [{ ...track.notes[0], velocity: 40 }],
        }] });
        assert(pcmRms(chord) > pcmRms(quietSingle) * 1.4, "Polyphonic notes did not render together.");
        const bufferContext = new OfflineAudioContext(1, 12000, 48000);
        const audioBuffer = bufferContext.createBuffer(1, 12000, 48000);
        const samples = audioBuffer.getChannelData(0);
        for (let i = 0; i < samples.length; i++) samples[i] = Math.sin(2 * Math.PI * 220 * i / 48000) * 0.2;
        const audioWav = await renderSessionWav({ ...single, tracks: [{
          ...track, type: "audio", instrument: null, notes: [],
          clips: [{
            id: "audio-clip", assetId: "audio-asset", name: "Audio regression",
            startSeconds: 0, durationSeconds: 0.25, sourceStartSeconds: 0,
            sourceDurationSeconds: 0.25, gain: 1, fadeInSeconds: 0, fadeOutSeconds: 0, waveform: [],
          }],
        }] }, async () => audioBuffer);
        assert(pcmRms(audioWav, 0.05, 0.15) > 0.03, "Existing audio-clip rendering became silent.");
        const sampleBufferContext = new OfflineAudioContext(1, 24_000, 48_000);
        const sampleBuffer = sampleBufferContext.createBuffer(1, 24_000, 48_000);
        const sampleData = sampleBuffer.getChannelData(0);
        for (let i = 0; i < sampleData.length; i++) {
          sampleData[i] = Math.sin(2 * Math.PI * 220 * i / 48_000) * 0.22;
        }
        const samplerTrack = {
          ...track,
          id: "sampler-render",
          name: "Sampler render",
          type: "sampler",
          volume: 1,
          instrument: null,
          sampler: { sampleAssetId: "sample-asset", rootNote: 60, gain: 0.7 },
          drumKit: null,
          notes: [{ id: "sample-pitch", pitch: 72, startBeat: 0.5, durationBeats: 0.25, velocity: 127 }],
        };
        const sampleSession = { ...single, tracks: [samplerTrack] };
        const renderSample = (value) => renderSessionWav(value, async (assetId) => {
          assert.equal(assetId, "sample-asset", "The sample renderer requested an unexpected asset.");
          return sampleBuffer;
        });
        const sampleWav = await renderSample(sampleSession);
        const sampleDuration = (sampleWav.byteLength - 44) / (48_000 * 4);
        assert(Math.abs(sampleDuration - 0.5) < 0.001, "The sampler export clipped or extended the one-shot tail.");
        assert(pcmRms(sampleWav, 0.05, 0.2) === 0, "The sampler ignored the saved note onset.");
        assert(pcmRms(sampleWav, 0.3, 0.45) > 0.03, "The sampler did not render its assigned sample.");
        const sampleView = new DataView(sampleWav.buffer, sampleWav.byteOffset, sampleWav.byteLength);
        let sampleCrossings = 0;
        for (let frame = 14_401; frame < 19_200; frame++) {
          if (sampleView.getInt16(44 + (frame - 1) * 4, true) <= 0 &&
              sampleView.getInt16(44 + frame * 4, true) > 0) sampleCrossings++;
        }
        assert(Math.abs(sampleCrossings / 0.1 - 440) < 10, "Sampler root-note transposition did not affect playback pitch.");
        const drumTrack = {
          ...samplerTrack,
          id: "drum-render",
          name: "Drum render",
          type: "drum",
          sampler: null,
          drumKit: {
            patternLengthBars: 1,
            patternStartBeat: 0,
            pads: [{ id: "kick-pad", name: "Kick", note: 36, sampleAssetId: "sample-asset", gain: 0.5 }],
          },
          notes: [{ id: "kick-hit", pitch: 36, startBeat: 0, durationBeats: 0.25, velocity: 127 }],
        };
        const drumSession = { ...single, tracks: [drumTrack] };
        const drumWav = await renderSample(drumSession);
        assert(pcmRms(drumWav, 0.05, 0.2) > 0.03, "The drum pad did not render its assigned sample.");
        const mutedSample = await renderSample({
          ...sampleSession,
          tracks: [{ ...samplerTrack, muted: true }],
        });
        assert(pcmRms(mutedSample) === 0, "A muted sampler leaked into the export.");
        const sampleBus = { ...renderBus, id: "sample-bus", name: "Sample Bus" };
        const routedSample = await renderSample({
          ...sampleSession,
          buses: [sampleBus],
          tracks: [{ ...samplerTrack, outputBusId: sampleBus.id }],
        });
        assert(Math.abs(pcmRms(routedSample, 0.3, 0.45) / pcmRms(sampleWav, 0.3, 0.45) - 1) < 0.02,
          "Sampler audio did not pass through the track output routing.");
        let missingSampleMessage = "";
        try {
          await renderSessionWav(sampleSession, async () => { throw new Error("file missing"); });
        } catch (error) {
          missingSampleMessage = error instanceof Error ? error.message : String(error);
        }
        assert(/sample is missing or unsupported/i.test(missingSampleMessage),
          "A missing sample did not produce a recovery error during export.");
        assert.equal(sampleSession.tracks[0].notes[0].id, "sample-pitch",
          "A missing sample changed or discarded the saved MIDI pattern.");
        let unassignedSampleMessage = "";
        try {
          await renderSessionWav({
            ...sampleSession,
            tracks: [{ ...samplerTrack, sampler: { ...samplerTrack.sampler, sampleAssetId: null } }],
          }, async () => sampleBuffer);
        } catch (error) {
          unassignedSampleMessage = error instanceof Error ? error.message : String(error);
        }
        assert(/no assigned sample/i.test(unassignedSampleMessage),
          "An unassigned sample note was silently omitted from the export.");
        await testInstrumentPanels();
        await report({ progress: "testing the effect browser, editable chains, and preset library UI" });
        await testEffectsWorkspace(session);
        await testRoutingWorkspace(session);

        // Real Web Audio graph checks use Chromium's silent sink, clock and meters.
        // They do not claim sound was heard through a physical Windows device.
        await report({ progress: "checking live MIDI playback and transport cleanup" });
        engine = new AudioEngine(() => { throw new Error("Unexpected audio asset request."); });
        const liveTrack = { ...track, notes: [{ ...track.notes[0], durationBeats: 8 }], muted: true };
        const live = { ...single, tracks: [liveTrack] };
        const cancelled = engine.start(live);
        engine.stop(true);
        await cancelled;
        assert(engine.snapshot().status === "stopped", "Pending Play restarted after Stop.");
        // This container has no physical output device. Chromium's silent sink
        // renders the actual graph without depending on a host audio callback.
        await engine.context.setSinkId({ type: "none" });

        await engine.start(live);
        await wait(300);
        assert(engine.snapshot().meters[track.id].peak < 0.005, "Muted live instrument was audible.");
        const unmuted = { ...live, tracks: [{ ...liveTrack, muted: false }] };
        engine.updateSession(unmuted);
        await wait(160);
        assert(engine.snapshot().meters[track.id].peak > 0.03,
          `Unmuting a held note stayed silent: ${JSON.stringify(engine.snapshot())}; context=${engine.context.state}/${engine.context.currentTime}; sources=${engine.sources.size}`);
        assert(engine.snapshot().meters.master.peak > 0.03, "The instrument did not reach the master meter.");
        const soloTrack = { ...track, id: "empty-solo", type: "audio", instrument: null, notes: [], solo: true };
        const soloSession = { ...unmuted, tracks: [...unmuted.tracks, soloTrack] };
        engine.updateSession(soloSession);
        await wait(250);
        assert(engine.snapshot().meters[track.id].peak < 0.005, "Solo did not gate the other instrument.");
        engine.updateSession({ ...soloSession, tracks: [...unmuted.tracks, { ...soloTrack, solo: false }] });
        await wait(160);
        assert(engine.snapshot().meters[track.id].peak > 0.03, "Unsoloing lost the held note.");

        const otherTrack = {
          ...track,
          id: "independent-instrument",
          name: "Independent Instrument",
          notes: [{ ...track.notes[0], id: "other-held" }],
        };
        const twoTracks = { ...unmuted, tracks: [...unmuted.tracks, otherTrack] };
        await engine.start(twoTracks, 0);
        await wait(260);
        const meterBeforeEdit = engine.snapshot().meters;
        const sourcesBeforeEdit = [...engine.sources];
        const eqOnFirst = {
          id: "live-eq",
          type: "equalizer",
          enabled: true,
          parameters: { frequency: 440, gain: -18, q: 1 },
        };
        const editedFirst = { ...twoTracks.tracks[0], effects: [eqOnFirst] };
        engine.updateSession({ ...twoTracks, tracks: [editedFirst, otherTrack] });
        await wait(180);
        const meterAfterEdit = engine.snapshot().meters;
        assert(meterAfterEdit[track.id].rms < meterBeforeEdit[track.id].rms * 0.45,
          "Editing one track's equalizer did not change its processed level.");
        assert(Math.abs(meterAfterEdit[otherTrack.id].rms / meterBeforeEdit[otherTrack.id].rms - 1) < 0.2,
          "Changing one track's effect leaked into the independent track.");
        assert(sourcesBeforeEdit.every((source) => engine.sources.has(source)),
          "An effect edit unnecessarily restarted active note voices.");
        const reorderedChain = [
          { id: "live-delay", type: "delay", enabled: true, parameters: { time: 0.01, feedback: 0.1, mix: 0.2 } },
          eqOnFirst,
        ];
        engine.updateSession({ ...twoTracks, tracks: [{ ...editedFirst, effects: reorderedChain }, otherTrack] });
        await wait(150);
        assert(sourcesBeforeEdit.every((source) => engine.sources.has(source)),
          "Reordering the effect chain restarted active note voices.");
        assert(engine.snapshot().meters.master.peak > 0.02,
          "Reordering the chain caused an audible playback dropout.");
        engine.updateSession(twoTracks);

        const liveBus = {
          id: "live-submix",
          name: "Live Submix",
          level: 1,
          muted: false,
          solo: false,
          outputBusId: null,
          sends: [],
          effects: [],
        };
        const sharedBusSession = {
          ...twoTracks,
          buses: [liveBus],
          tracks: twoTracks.tracks.map((item) => ({ ...item, outputBusId: liveBus.id, sends: [] })),
        };
        const sourcesBeforeRouting = [...engine.sources];
        engine.updateSession(sharedBusSession);
        await wait(180);
        const busMeterFull = engine.snapshot().meters[`bus:${liveBus.id}`];
        assert(busMeterFull?.peak > 0.03, "Multiple live tracks did not reach their shared bus meter.");
        assert(engine.snapshot().meters.master.peak > 0.03, "The live bus signal did not reach the master.");
        assert(sourcesBeforeRouting.every((source) => engine.sources.has(source)),
          "Changing track outputs restarted active MIDI voices.");
        engine.updateSession({
          ...sharedBusSession,
          buses: [{ ...liveBus, level: 0.25 }],
        });
        await wait(180);
        const busMeterQuarter = engine.snapshot().meters[`bus:${liveBus.id}`];
        assert(busMeterQuarter.rms < busMeterFull.rms * 0.45,
          "The live bus fader did not change its metered output level.");
        const soloBusSession = {
          ...sharedBusSession,
          buses: [{ ...liveBus, solo: true }],
          tracks: [
            { ...twoTracks.tracks[0], outputBusId: liveBus.id, sends: [] },
            { ...otherTrack, outputBusId: null, sends: [] },
          ],
        };
        engine.updateSession(soloBusSession);
        await wait(170);
        assert(engine.snapshot().meters[otherTrack.id].peak < 0.005,
          "Soloing a bus did not silence unrelated master-routed tracks.");
        assert(engine.snapshot().meters[track.id].peak > 0.03,
          "Soloing a bus silenced its upstream track.");
        assert(sourcesBeforeRouting.every((source) => engine.sources.has(source)),
          "Changing bus solo/routing restarted active MIDI voices.");
        engine.updateSession(twoTracks);

        engine.seek(1);
        await wait(250);
        assert(engine.snapshot().position >= 1, "Seek did not restore the requested timeline position.");
        assert(engine.snapshot().meters.master.peak > 0.03, "Seek lost an overlapping MIDI note.");
        engine.pause();
        assert(engine.snapshot().status === "stopped", "Pause left the transport running.");
        const looped = { ...unmuted, loopRange: { enabled: true, startSeconds: 0.1, endSeconds: 0.4 } };
        await engine.start(looped, 0.1);
        await wait(800);
        const loopPosition = engine.snapshot().position;
        assert(loopPosition >= 0.1 && loopPosition <= 0.4, "Loop playback left its bounds.");
        engine.stop(true);
        await wait(100);
        assert(engine.snapshot().meters.master.peak < 0.005, "Stop left an instrument voice sounding.");
        assert(engine.snapshot().position === 0, "Return to start did not reset position.");
        const pendingDispose = engine.start(live).catch(() => undefined);
        await engine.dispose();
        await pendingDispose;
        assert(engine.snapshot().status === "stopped", "Closing a project restarted its audio.");
        engine = null;

        await report({ progress: "checking live sampler playback, track metering, and preview routing" });
        const sampleBytes = encodeAudioBufferWav(sampleBuffer);
        const sampleUrl = URL.createObjectURL(new Blob([sampleBytes], { type: "audio/wav" }));
        try {
          sampleEngine = new AudioEngine((assetId) => {
            if (assetId !== "sample-asset") throw new Error(`Unexpected sample asset ${assetId}`);
            return sampleUrl;
          });
          const liveSampleTrack = {
            ...samplerTrack,
            muted: true,
            notes: [{ id: "live-sample-note", pitch: 60, startBeat: 0, durationBeats: 8, velocity: 127 }],
          };
          const liveSampleSession = { ...sampleSession, tracks: [liveSampleTrack] };
          const cancelledSampleStart = sampleEngine.start(liveSampleSession);
          sampleEngine.stop(true);
          await cancelledSampleStart;
          await sampleEngine.context.setSinkId({ type: "none" });
          await sampleEngine.start(liveSampleSession);
          await wait(100);
          assert(sampleEngine.snapshot().sampleErrors.length === 0, "A valid sample was reported as missing.");
          assert(sampleEngine.snapshot().meters[liveSampleTrack.id].peak < 0.005, "A muted live sampler was audible.");
          sampleEngine.updateSession({
            ...liveSampleSession,
            tracks: [{ ...liveSampleTrack, muted: false }],
          });
          await wait(180);
          assert(sampleEngine.snapshot().meters[liveSampleTrack.id].peak > 0.03,
            "Live sampler playback did not reach the track meter after unmuting.");
          sampleEngine.stop(true);
          await sampleEngine.previewInstrumentNote(liveSampleSession, liveSampleTrack.id, 60, 127);
          await wait(120);
          assert(sampleEngine.snapshot().meters[liveSampleTrack.id].peak > 0.03,
            "Sampler preview did not reach its track audio path.");
          await sampleEngine.dispose();
          sampleEngine = null;

          missingEngine = new AudioEngine(() => "data:audio/wav;base64,AA==");
          const missingLive = {
            ...sampleSession,
            tracks: [{ ...samplerTrack, muted: true }],
          };
          const cancelledMissingStart = missingEngine.start(missingLive);
          missingEngine.stop(true);
          await cancelledMissingStart;
          await missingEngine.context.setSinkId({ type: "none" });
          await missingEngine.start(missingLive);
          await wait(80);
          assert(missingEngine.snapshot().sampleErrors.includes("sample-asset"),
            "A missing sample was not surfaced in engine state.");
          assert(/missing or unsupported/i.test(missingEngine.snapshot().error ?? ""),
            "A missing sample had no clear recovery message.");
          assert.equal(missingLive.tracks[0].notes[0].id, "sample-pitch",
            "Starting with a missing sample discarded its MIDI pattern.");
          await missingEngine.dispose();
          missingEngine = null;
        } finally {
          URL.revokeObjectURL(sampleUrl);
        }

        result.textContent = `PASS: MIDI, sampler and drum audio rendering, drum step sequencing, bus routing/effects, live sample meters/preview, transport and recovery; WAV peak ${peak}.`;
        document.body.dataset.testResult = "pass";
      } catch (error) {
        result.textContent = `FAIL: ${error instanceof Error ? error.message : String(error)}`;
        document.body.dataset.testResult = "fail";
      } finally {
        await engine?.dispose();
        await sampleEngine?.dispose();
        await missingEngine?.dispose();
        await report({ result: result.textContent });
      }
    </script>
  </body>
</html>
