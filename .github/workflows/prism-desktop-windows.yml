name: Build PRISM Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/prism-desktop/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/prism-desktop-windows.yml"

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/prism-desktop...

      - name: Typecheck PRISM
        run: pnpm --filter @workspace/prism-desktop run typecheck

      - name: Build genuine native VST3 host and isolated legal fixtures
        shell: pwsh
        run: |
          cmake -S artifacts/prism-desktop/native/vst-host -B generated-artifacts/prism-native-build -A x64 -DPRISM_VST_TEST_FIXTURES=ON
          if ($LASTEXITCODE -ne 0) { throw "Native configure failed." }
          cmake --build generated-artifacts/prism-native-build --config Release --target prism-vst-host mda-vst3 prism-host-test-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native compilation failed." }
          $runtime = "generated-artifacts/prism-native-runtime"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item generated-artifacts/prism-native-build/Release/prism-vst-host.exe $runtime/
          Copy-Item generated-artifacts/prism-native-build/notices $runtime/ -Recurse
          $hostExe = Resolve-Path "$runtime/prism-vst-host.exe"
          $plugin = Resolve-Path generated-artifacts/prism-native-build/VST3/Release/mda-vst3.vst3
          pnpm --filter @workspace/prism-desktop exec tsx scripts/test-native-vst.ts "$hostExe" "$plugin"
          if ($LASTEXITCODE -ne 0) { throw "Real native instrument/effect processing failed." }

      - name: Build and check native audio device host (WASAPI; ASIO disabled)
        shell: pwsh
        run: |
          cmake -S artifacts/prism-desktop/native/audio-host -B generated-artifacts/prism-audio-host-build -A x64 -DPRISM_ENABLE_ASIO=OFF
          if ($LASTEXITCODE -ne 0) { throw "Native audio configure failed." }
          cmake --build generated-artifacts/prism-audio-host-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native audio compilation failed." }
          ctest --test-dir generated-artifacts/prism-audio-host-build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native audio core checks failed." }
          Copy-Item generated-artifacts/prism-audio-host-build/Release/prism-audio-host.exe generated-artifacts/prism-native-runtime/
          Copy-Item generated-artifacts/prism-audio-host-build/notices/*.txt generated-artifacts/prism-native-runtime/notices/
          pnpm --filter @workspace/prism-desktop exec tsx scripts/test-native-audio-host.ts "$PWD/generated-artifacts/prism-native-runtime/prism-audio-host.exe"
          if ($LASTEXITCODE -ne 0) { throw "Real native audio host protocol checks failed." }

      - name: Run PRISM audio and persistence tests
        run: pnpm --filter @workspace/prism-desktop run test

      - name: Check portable project files
        run: |
          pnpm --filter @workspace/prism-desktop run test:projects
          pnpm --filter @workspace/prism-desktop run test:arrangement
          pnpm --filter @workspace/prism-desktop run test:instruments
          pnpm --filter @workspace/prism-desktop run test:tempo
          pnpm --filter @workspace/prism-desktop exec tsx --test src/shared/native-plugins.test.ts
          pnpm --filter @workspace/prism-desktop exec tsx --test src/renderer/workspace-layout.test.ts
          pnpm --filter @workspace/prism-desktop exec tsx --test src/main/workspace-smoke-data.test.ts
          pnpm --filter @workspace/prism-desktop exec tsx --test src/shared/native-audio.test.ts

      - name: Check audio rendering, effects, and transport
        shell: pwsh
        run: |
          $env:CHROMIUM_PATH = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $env:CHROMIUM_PATH)) { throw "Chrome is required for the Web Audio checks." }
          pnpm --filter @workspace/prism-desktop run test:audio-render

      - name: Build Windows installer
        run: pnpm --filter @workspace/prism-desktop run package:win

      - name: Install and reopen the packaged Windows application
        shell: pwsh
        run: ./artifacts/prism-desktop/scripts/test-installed-windows.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Windows-Installer
          path: artifacts/prism-desktop/release/PRISM Setup *.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload installed editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Installed-Editor-Evidence
          path: |
            ${{ runner.temp }}/prism-smoke-*/*.json
            ${{ runner.temp }}/prism-smoke-*/*.png
          if-no-files-found: warn
          retention-days: 14
